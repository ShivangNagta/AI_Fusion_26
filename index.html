<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IIT ROPAR // CAMPUS NAV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-neon-blue: #00f3ff;
        --color-neon-pink: #ff00ff;
        --color-deep-space: #050b14;
        --color-grid: #0d1b2a;
      }
      
      body {
        margin: 0;
        background-color: var(--color-deep-space);
        color: var(--color-neon-blue);
        font-family: 'Share Tech Mono', monospace;
        overflow-x: hidden;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Orbitron', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      /* CRT Scanline Effect */
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.1) 50%,
          rgba(0,0,0,0.1)
        );
        background-size: 100% 4px;
        z-index: 9999;
        pointer-events: none;
        animation: scanlineScroll 0.5s linear infinite; /* Highly reduced motion for comfort, just texture */
      }

      .glow-text {
        text-shadow: 0 0 5px var(--color-neon-blue), 0 0 10px var(--color-neon-blue);
      }

      .glow-box {
        box-shadow: 0 0 10px var(--color-neon-blue), inset 0 0 20px rgba(0, 243, 255, 0.2);
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .animate-blink {
        animation: blink 1s step-end infinite;
      }
    </style>
